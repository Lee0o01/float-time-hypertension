name: Build Android APK

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 7.6.1

      - name: Fix Gradle Wrapper (if corrupted)
        run: |
          echo "Checking Gradle Wrapper integrity..."

          # 检查并删除损坏的文件
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -f gradle/wrapper/gradle-wrapper.properties

          # 创建目录（如果不存在）
          mkdir -p gradle/wrapper

          # 下载 gradle-wrapper.properties
          echo "Downloading gradle-wrapper.properties..."
          curl -L --fail --retry 3 --retry-delay 3 -o gradle/wrapper/gradle-wrapper.properties \
            https://raw.githubusercontent.com/gradle/gradle/v7.6.1/gradle/wrapper/gradle-wrapper.properties

          if [ $? -ne 0 ]; then
            echo "Failed to download gradle-wrapper.properties, trying alternative method..."
            # 备用方案：创建基本的 wrapper properties
            cat > gradle/wrapper/gradle-wrapper.properties << EOF
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.1-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          fi

          # 下载 gradle-wrapper.jar（从多个源尝试）
          echo "Downloading gradle-wrapper.jar..."
          for i in {1..3}; do
            echo "Attempt $i: Downloading gradle-wrapper.jar..."
            curl -L --fail --retry 3 --retry-delay 5 -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v7.6.1/gradle/wrapper/gradle-wrapper.jar

            if [ $? -eq 0 ]; then
              echo "Downloaded successfully"
              break
            else
              echo "Download failed, trying alternative source..."
              # 备用源
              curl -L --fail --retry 3 --retry-delay 5 -o gradle/wrapper/gradle-wrapper.jar \
                https://services.gradle.org/distributions/gradle-7.6.1-bin.zip

              if [ $? -eq 0 ]; then
                echo "Downloaded from alternative source"
                break
              fi
            fi

            if [ $i -eq 3 ]; then
              echo "ERROR: Failed to download gradle-wrapper.jar after 3 attempts"
              exit 1
            fi
            sleep 2
          done

          # 验证下载的文件
          echo "Verifying downloaded files..."
          ls -lh gradle/wrapper/
          echo "--- gradle-wrapper.properties ---"
          cat gradle/wrapper/gradle-wrapper.properties

          # 检查文件大小（应该大于 50KB）
          FILE_SIZE=$(stat -f%z gradle/wrapper/gradle-wrapper.jar 2>/dev/null || stat -c%s gradle/wrapper/gradle-wrapper.jar 2>/dev/null)
          if [ "$FILE_SIZE" -lt 50000 ]; then
            echo "ERROR: gradle-wrapper.jar is too small ($FILE_SIZE bytes), likely corrupted"
            exit 1
          fi

          echo "Gradle wrapper verification passed (size: $FILE_SIZE bytes)"

      - name: Verify Gradle wrapper
        run: |
          echo "=== Gradle wrapper files ==="
          ls -lh gradle/wrapper/
          echo ""
          echo "=== gradle-wrapper.properties content ==="
          cat gradle/wrapper/gradle-wrapper.properties
          echo ""
          echo "=== Testing gradlew ==="
          file gradlew
          ls -l gradlew

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean previous build
        run: ./gradlew clean
        continue-on-error: false

      - name: Build with Gradle
        run: ./gradlew assembleRelease
        continue-on-error: false

      - name: Upload APK (Release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload APK (Debug) for testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show build outputs
        if: always()
        run: |
          echo "=== Build Outputs ==="
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "No APK outputs found"
          echo "=== Gradle Build Scan ==="
          if [ -f build-scan.gradle ]; then
            cat build-scan.gradle
          fi