name: Build Android APK

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 7.6.1

      - name: Fix Gradle Wrapper (if corrupted)
        run: |
          echo "Checking Gradle Wrapper integrity..."
          # 检查 gradle-wrapper.jar 是否存在且可用
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper is missing or empty. Regenerating..."
            # 方法1：删除旧的 wrapper 相关文件
            rm -f gradle/wrapper/gradle-wrapper.jar
            rm -f gradle/wrapper/gradle-wrapper.properties

            # 方法2：从官方仓库下载 gradle-wrapper.properties
            curl -L -o gradle/wrapper/gradle-wrapper.properties \
              https://raw.githubusercontent.com/gradle/gradle/v7.6.1/gradle/wrapper/gradle-wrapper.properties

            # 方法3：从官方仓库下载 gradle-wrapper.jar
            curl -L -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v7.6.1/gradle/wrapper/gradle-wrapper.jar

            echo "Gradle wrapper regenerated successfully"
          else
            echo "Gradle wrapper exists and looks good"
          fi

      - name: Verify Gradle wrapper
        run: |
          ls -lh gradle/wrapper/
          echo "=== gradle-wrapper.properties ==="
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean previous build
        run: ./gradlew clean
        continue-on-error: false

      - name: Build with Gradle
        run: ./gradlew assembleRelease
        continue-on-error: false

      - name: Upload APK (Release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload APK (Debug) for testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show build outputs
        if: always()
        run: |
          echo "=== Build Outputs ==="
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "No APK outputs found"
          echo "=== Gradle Build Scan ==="
          if [ -f build-scan.gradle ]; then
            cat build-scan.gradle
          fi